<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการรถขนส่ง</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI, Arial, sans-serif;
        }

        body {
            background: #eef2f7;
            padding: 0px;
        }

        .container {
            max-width: 1500px;
            margin: auto;
            padding: 10px;
        }

        .main-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .title {
            font-size: 28px;
            color: #2c5282;
            font-weight: bold;
        }

        /* Search Wrapper & Button Styles */
        .search-wrapper {
            position: relative;
            width: 300px;
        }

        .searchBox {
            padding: 8px;
            padding-right: 35px; /* Make room for the X button */
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .clear-btn {
            display: none; /* Hidden by default */
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            color: #999;
            cursor: pointer;
            line-height: 1;
            padding: 2px;
        }

        .clear-btn:hover {
            color: #333;
        }

        .data-container {
            overflow: auto;
            max-height: 700px;
            padding-right: 5px; 
        }

        .truck-card {
            margin-bottom: 5px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 5px rgba(0,0,0,.05);
            overflow: hidden;
        }

        .truck-header {
            margin: 0;
            padding: 8px;
            background: #f1f5f9;
            color: #1e293b;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer; 
            transition: background 0.2s;
        }

        .truck-header:hover {
            background: #dbeafe; 
            color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 2;
        }

        th {
            background: #2c5282;
            color: white;
            padding: 6px;
            text-align: left;
            font-size: 13px;
        }

        td {
            padding: 6px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        tr:nth-child(even) { background: #f8f8f8; }
        tr:hover { background: #d9ebff; }

        .loading {
            text-align: center;
            padding: 40px;
            color: gray;
            font-size: 16px;
        }

        .qty { color: #006600; }

        .footer-text {
            font-size: 12px;
            text-align: right;
            padding-right: 15px;
            color: #64748b;
        }

        @media(max-width: 700px) {
            .title { font-size: 22px; }
            .search-wrapper { width: 50%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <div class="header">
            <div class="title">🚚 รายการรถขนส่ง</div>
            <div class="search-wrapper">
                <input type="text" class="searchBox" id="search" placeholder="ค้นหาทะเบียน">
                <button class="clear-btn" id="clearBtn" onclick="clearSearch()" title="Clear search">&times;</button>
            </div>
        </div>

        <div class="data-container" id="data-container">
            <div class="loading">กำลังโหลดข้อมูล...</div>
        </div>
    </div>
    
    <div class="footer-text" style="margin-top: 15px;">Version 2.94</div>
    <div class="footer-text">Powered by Flatbar Division™️</div>
</div>

<script>
    const part0 = "AIzaSyAFnyXSAki4Licz";
    const part1 = "KNhyEzbhHsvTC-abfAo";
    const apiKey = part0 + part1;
    const spreadsheetId = "1IkO_AxMnh_yYFDsEV_7MAaGUCrgXptbby6et7Rt-T5w";
    const range = "shipment_data_table!A:Q";

    async function loadData() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`;
        const container = document.getElementById("data-container");

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
            
            const json = await response.json();
            const sheetData = json.values || [];

            if (sheetData.length === 0) {
                container.innerHTML = "<div class='loading'>No data found.</div>";
                return;
            }

            const groups = {};

            sheetData.forEach((row, index) => {
                if (index === 0 ) return; 

                const truck = row[2] || "Unknown";
                if (!groups[truck]) {
                    groups[truck] = [];
                }
                groups[truck].push(row);
            });

            let html = "";

            for (const truck in groups) {
                html += `
                    <div class="truck-card">
                        <h4 class="truck-header" onclick="filterByTruck('${truck}')" title="คลิกเพื่อค้นหารถคันนี้">🚚 ทะเบียน ${truck}</h4>
                        <table>
                            <thead>
                                <tr>
                                    <th>ชื่อผลิตภัณฑ์</th>
                                    <th>Batch</th>
                                    <th>จำนวน</th>
                                    <th>ชื่อลูกค้า</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                groups[truck].forEach(r => {
                    const searchData = `${truck} ${r[11] || ""} ${r[6] || ""} ${r[12] || ""} ${r[8] || ""}`.toLowerCase();
                    
                    html += `
                                <tr data-search="${searchData}">
                                    <td>${r[11] || "-"}</td>
                                    <td>${r[6] || "-"}</td>
                                    <td class="qty"><b>${r[12] || "-"}</b></td>
                                    <td>${r[8] || "-"}</td>
                                </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            }

            container.innerHTML = html;
            applySearchFilter();

        } catch (e) {
            container.innerHTML = `<div class='loading' style='color:red;'>Cannot load data. Error: ${e.message}</div>`;
            console.error("Data fetch error:", e);
        }
    }

    // Toggle Clear Button Visibility
    function toggleClearButton() {
        const searchInput = document.getElementById('search');
        const clearBtn = document.getElementById('clearBtn');
        if (searchInput.value.length > 0) {
            clearBtn.style.display = 'block';
        } else {
            clearBtn.style.display = 'none';
        }
    }

    // Clear Search Input
    function clearSearch() {
        const searchInput = document.getElementById('search');
        searchInput.value = '';
        toggleClearButton();
        applySearchFilter();
        searchInput.focus(); // Keep cursor in the box after clearing
    }

    // Filter by clicking truck header
    function filterByTruck(truckNumber) {
        const searchInput = document.getElementById('search');
        searchInput.value = truckNumber; 
        toggleClearButton(); // Show the 'X' button
        applySearchFilter(); 
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function applySearchFilter() {
        const keywordString = document.getElementById('search').value.toLowerCase().trim();
        const keywords = keywordString.split(/\s+/); 
        const cards = document.querySelectorAll("#data-container .truck-card");

        cards.forEach(card => {
            let hasVisibleRow = false;
            const rows = card.querySelectorAll("tbody tr");

            rows.forEach(row => {
                const text = row.getAttribute('data-search');
                
                if (text) {
                    // Show all if keyword is empty, else check for matches
                    const isMatch = keywordString === "" || keywords.every(kw => text.includes(kw));
                    
                    if (isMatch) {
                        row.style.display = "";
                        hasVisibleRow = true;
                    } else {
                        row.style.display = "none";
                    }
                }
            });

            card.style.display = hasVisibleRow ? "" : "none";
        });
    }

    let typingTimer; 
    const delay = 250; 

    // Listen to both keyup and input events to instantly toggle the 'X' button
    const searchElement = document.getElementById("search");
    
    searchElement.addEventListener("input", toggleClearButton);
    searchElement.addEventListener("keyup", function() {
        clearTimeout(typingTimer);
        typingTimer = setTimeout(applySearchFilter, delay);
    });

    // Initial load
    loadData();

</script>
</body>
</html>
