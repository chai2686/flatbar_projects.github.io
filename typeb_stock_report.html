<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่วนงานเกรดบี - รายงานสต็อก</title>
    <!-- Load Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Noto Sans Thai Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif;
        }
        /* Custom scrollbar for the table container */
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f8fafc; border-radius: 0.5rem; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 min-h-screen" style="padding: 5px;">

    <!-- Main Stock Report Card -->
    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">

        <!-- Header Bar -->
        <div class="bg-gradient-to-r from-blue-700 to-cyan-600 px-6 py-5 flex flex-col md:flex-row justify-between items-center gap-4" style="padding: 5px; flex-direction: row;">
            <h1 onclick="updateStock()" class="text-2xl font-bold text-white flex items-center gap-2 cursor-pointer select-none">
                <!-- Settings Trigger Icon (stops propagation so it does not trigger updateStock) -->
                <svg id="settingsIconBtn" onclick="openSettingsModal(event)" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 cursor-pointer hover:opacity-80 active:scale-95 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" title="ตั้งค่า">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                สต็อกท่อเกรดบี
            </h1>
            <div class="bg-white/20 text-white text-sm font-semibold px-4 py-2 rounded-full backdrop-blur-sm" style="text-align: center; padding: 5px; font-size: 13px; width: 40%;">
                อัพเดทวันที่ 12-มิ.ย.-2026
            </div>
        </div>

        <!-- Search Bar & Edit Mode Status Pill -->
        <div class="p-4 md:px-6 border-b border-slate-200 bg-slate-50 flex flex-wrap justify-between items-center gap-3">
            <div class="relative w-full max-w-sm">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <input type="text" id="searchInput" placeholder="ค้นหาไซส์ท่อ..." class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg leading-5 bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-shadow">
            </div>

            <!-- Edit Mode Active Badge (shown only when "อนุญาตให้แก้ไข" is checked) -->
            <div id="editModeBadge" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-50 border border-amber-300 text-amber-800 text-xs font-semibold shadow-sm">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span>โหมดแก้ไขเปิดอยู่</span>
            </div>
        </div>

        <!-- Scrollable Stock Table -->
        <div class="table-container overflow-x-auto max-h-[600px]">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-100 text-slate-600 sticky top-0 z-10 shadow-sm border-b border-slate-200">
                    <tr>
                        <th class="py-4 px-6 font-semibold whitespace-nowrap min-w-[100px]" style="padding-top: 5px; padding-bottom: 5px;">ไซส์</th>
                        <th class="py-4 px-6 font-semibold text-right whitespace-nowrap max-w-[80px]" style="padding-top: 5px; padding-bottom: 5px;">ท่อเหล็กดำ</th>
                        <th class="py-4 px-6 font-semibold text-right whitespace-nowrap max-w-[80px]" style="padding-top: 5px; padding-bottom: 5px;">ท่อเหล็ก GI</th>
                        <th class="py-4 px-6 font-semibold text-right whitespace-nowrap max-w-[80px] text-blue-700" style="padding-top: 5px; padding-bottom: 5px;">จำนวนรวม</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-100">
                    <!-- Rows rendered dynamically via renderTable() -->
                </tbody>
                <tfoot class="bg-slate-50 border-t-2 border-slate-300 sticky bottom-0 z-10">
                    <tr>
                        <td colspan="3" class="py-4 px-6 font-bold text-slate-800 text-right">จำนวนทั้งหมด</td>
                        <td id="grand-total" class="py-4 px-6 font-bold text-xl text-blue-700 text-right">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- Bottom Footer Branding Bar -->
    <div class="footer-text max-w-5xl mx-auto" style="padding-top: 1rem; display: flex; justify-content: space-between; font-size: 0.75rem; color: #64748b;">
        <span>Powered by Flatbar Division™️</span>
        <span onclick="about()" class="cursor-pointer hover:underline">Version 3.0</span>
    </div>

    <!-- SETTINGS POPUP MODAL -->
    <div id="settingsModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/50 backdrop-blur-[2px]" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
        <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
            <!-- Modal Header -->
            <div class="px-5 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                <h2 id="settingsModalTitle" class="text-base font-bold text-slate-800">ตั้งค่า</h2>
                <button type="button" id="closeSettingsIconBtn" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/70 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500" aria-label="ปิดหน้าต่างตั้งค่า">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-5">
                <label for="allowEditCheckbox" class="flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 bg-slate-50/70 hover:bg-blue-50/40 hover:border-blue-200 cursor-pointer transition-colors select-none">
                    <input type="checkbox" id="allowEditCheckbox" class="mt-0.5 h-5 w-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 accent-blue-600 cursor-pointer shrink-0">
                    <div class="min-w-0">
                        <span class="block text-sm font-semibold text-slate-800">อนุญาตให้แก้ไข</span>
                        <span class="block text-xs text-slate-500 mt-1 leading-relaxed">
                            เมื่อเปิดใช้งาน สามารถคลิกที่ชื่อไซส์ท่อในตารางเพื่อแก้ไขจำนวน ท่อเหล็กดำ และ ท่อเหล็ก GI ได้
                        </span>
                    </div>
                </label>
            </div>

            <!-- Modal Footer -->
            <div class="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-end">
                <button type="button" id="closeSettingsBtn" class="px-5 py-2 rounded-xl text-sm font-semibold text-slate-700 bg-white hover:bg-slate-100 border border-slate-300 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-400">
                    ปิด
                </button>
            </div>
        </div>
    </div>

    <!-- EDIT ROW POPUP MODAL -->
    <div id="editRowModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/50 backdrop-blur-[2px]" role="dialog" aria-modal="true" aria-labelledby="editRowModalTitle">
        <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
            <!-- Modal Header -->
            <div class="px-5 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between gap-2">
                <div class="min-w-0">
                    <h2 id="editRowModalTitle" class="text-base font-bold text-slate-800">แก้ไขข้อมูลสต็อก</h2>
                    <p class="text-xs text-blue-700 font-semibold mt-0.5 truncate">
                        ไซส์ท่อ: <span id="editRowPipeName">-</span>
                    </p>
                </div>
                <button type="button" id="closeEditRowIconBtn" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/70 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 shrink-0" aria-label="ปิดหน้าต่างแก้ไข">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Edit Form -->
            <form id="editRowForm" novalidate class="p-5 space-y-4">
                <!-- ท่อเหล็กดำ Input -->
                <div>
                    <label for="editBlackInput" class="block text-sm font-semibold text-slate-700 mb-1.5">
                        ท่อเหล็กดำ
                    </label>
                    <input type="number" id="editBlackInput" inputmode="numeric" step="1" min="0" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors tabular-nums">
                    <p id="editBlackError" class="hidden text-xs text-red-600 mt-1 font-medium"></p>
                </div>

                <!-- ท่อเหล็ก GI Input -->
                <div>
                    <label for="editGiInput" class="block text-sm font-semibold text-slate-700 mb-1.5">
                        ท่อเหล็ก GI
                    </label>
                    <input type="number" id="editGiInput" inputmode="numeric" step="1" min="0" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors tabular-nums">
                    <p id="editGiError" class="hidden text-xs text-red-600 mt-1 font-medium"></p>
                </div>

                <!-- Read-only Live Total Preview -->
                <div class="bg-blue-50 border border-blue-200 rounded-xl px-4 py-2.5 flex items-center justify-between">
                    <span class="text-xs font-semibold text-blue-700">จำนวนรวม</span>
                    <span id="editTotalPreview" class="text-base font-bold text-blue-800 tabular-nums">0</span>
                </div>

                <!-- Action Buttons -->
                <div class="pt-2 flex items-center justify-end gap-2.5 border-t border-slate-100">
                    <button type="button" id="cancelEditRowBtn" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-300 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-400">
                        ยกเลิก
                    </button>
                    <button type="submit" id="saveEditRowBtn" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 border border-blue-700 shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1">
                        บันทึก
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Subtle Non-Blocking Toast Banner -->
    <div id="toastBanner" role="status" aria-live="polite" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] pointer-events-none opacity-0 translate-y-2 transition-all duration-200 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-lg max-w-[90vw] text-center">
        <span id="toastMessage">บันทึกสำเร็จ</span>
    </div>

    <script>
    // =========================================================================
    // 1. Blank Global Function for Submitting Edited Values
    // =========================================================================
    async function summitGS(size, black, gi) {
        const formUrl =
            'https://docs.google.com/forms/d/e/1FAIpQLSf4OqAabdM32leCV0UbLyqG-rmGZQNnxBBcm-ZlP5HLrYh4Fw/formResponse';

        const targetItem = inventoryData.find(item => item.name === size);
        const currentBlack = targetItem ? (Number(targetItem.black) || 0) : 0;
        const currentGi = targetItem ? (Number(targetItem.gi) || 0) : 0;

        const nogiValue = Number(black) - currentBlack;
        const giValue = Number(gi) - currentGi;

        const formBody = new URLSearchParams();
        formBody.append('entry.1362014552', String(size));
        formBody.append('entry.1472257121', String(nogiValue));
        formBody.append('entry.1655074373', String(giValue));

        await fetch(formUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
            },
            body: formBody.toString(),
        });
    }

    // =========================================================================
    // 2. Inventory Data Array (All 36 Pipe Sizes Preserved)
    // =========================================================================
    const inventoryData = [
        { name: 'ท่อดำ 1 1/2"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 1 1/4"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 1"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 1/2"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 10"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 2 1/2"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 2"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 3 1/2"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 3"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 3/4"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 4"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 5"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 6"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อดำ 8"', black: 0, gi: 0, total: 0 },
        { name: 'ท่อเหลี่ยม 100x100', black: 0, gi: 0, total: 0 },
        { name: 'ท่อเหลี่ยม 125x125', black: 0, gi: 0, total: 0 },
        { name: 'ท่อเหลี่ยม 150x150', black: 0, gi: 0, total: 0 },
        { name: 'ท่อเหลี่ยม 19x19', black: 0, gi: 0, total: 0 },
        { name: 'ท่อเหลี่ยม 200x200', black: 0, gi: 0, total: 0 },
        { name: 'ท่อเหลี่ยม 25x25', black: 0, gi: 0, total: 0 },
        { name: 'ท่อเหลี่ยม 32x32', black: 0, gi: 0, total: 0 },
        { name: 'ท่อเหลี่ยม 38x38', black: 0, gi: 0, total: 0 },
        { name: 'ท่อเหลี่ยม 50x50', black: 0, gi: 0, total: 0 },
        { name: 'ท่อเหลี่ยม 75x75', black: 0, gi: 0, total: 0 },
        { name: 'แป๊บแบน 100x50', black: 0, gi: 0, total: 0 },
        { name: 'แป๊บแบน 125x50', black: 0, gi: 0, total: 0 },
        { name: 'แป๊บแบน 125x75', black: 0, gi: 0, total: 0 },
        { name: 'แป๊บแบน 150x100', black: 0, gi: 0, total: 0 },
        { name: 'แป๊บแบน 150x50', black: 0, gi: 0, total: 0 },
        { name: 'แป๊บแบน 150x75', black: 0, gi: 0, total: 0 },
        { name: 'แป๊บแบน 200x100', black: 0, gi: 0, total: 0 },
        { name: 'แป๊บแบน 50x25', black: 0, gi: 0, total: 0 },
        { name: 'แป๊บแบน 60x30', black: 0, gi: 0, total: 0 },
        { name: 'แป๊บแบน 70x45', black: 0, gi: 0, total: 0 },
        { name: 'แป๊บแบน 75x38', black: 0, gi: 0, total: 0 },
        { name: 'แป๊บแบน 75x45', black: 0, gi: 0, total: 0 }
    ];

    // =========================================================================
    // 3. State & DOM References
    // =========================================================================
    const ALLOW_EDIT_STORAGE_KEY = 'typeb_stock_allow_edit';
    let allowEdit = false;
    let editingItem = null;
    let toastTimer = null;

    const tableBody = document.getElementById('table-body');
    const grandTotalElement = document.getElementById('grand-total');
    const searchInput = document.getElementById('searchInput');
    const editModeBadge = document.getElementById('editModeBadge');

    // Settings modal elements
    const settingsModal = document.getElementById('settingsModal');
    const allowEditCheckbox = document.getElementById('allowEditCheckbox');
    const closeSettingsIconBtn = document.getElementById('closeSettingsIconBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');

    // Edit row modal elements
    const editRowModal = document.getElementById('editRowModal');
    const editRowForm = document.getElementById('editRowForm');
    const editRowPipeName = document.getElementById('editRowPipeName');
    const editBlackInput = document.getElementById('editBlackInput');
    const editGiInput = document.getElementById('editGiInput');
    const editBlackError = document.getElementById('editBlackError');
    const editGiError = document.getElementById('editGiError');
    const editTotalPreview = document.getElementById('editTotalPreview');
    const closeEditRowIconBtn = document.getElementById('closeEditRowIconBtn');
    const cancelEditRowBtn = document.getElementById('cancelEditRowBtn');

    // Toast elements
    const toastBanner = document.getElementById('toastBanner');
    const toastMessage = document.getElementById('toastMessage');

    // =========================================================================
    // 4. Local Memory Persistence & UI Helpers
    // =========================================================================
    function loadAllowEditSetting() {
        try {
            const saved = window.localStorage.getItem(ALLOW_EDIT_STORAGE_KEY);
            allowEdit = saved === 'true';
        } catch (err) {
            // Fallback cleanly to in-memory state if localStorage is restricted
            allowEdit = false;
        }
        allowEditCheckbox.checked = allowEdit;
        updateEditModeBadge();
    }

    function saveAllowEditSetting(value) {
        allowEdit = Boolean(value);
        try {
            window.localStorage.setItem(ALLOW_EDIT_STORAGE_KEY, String(allowEdit));
        } catch (err) {
            // Silently keep in-memory state if localStorage is unavailable
        }
        updateEditModeBadge();
    }

    function updateEditModeBadge() {
        if (allowEdit) {
            editModeBadge.classList.remove('hidden');
            editModeBadge.classList.add('inline-flex');
        } else {
            editModeBadge.classList.add('hidden');
            editModeBadge.classList.remove('inline-flex');
        }
    }

    function showToast(message) {
        toastMessage.textContent = message;
        toastBanner.classList.remove('opacity-0', 'translate-y-2');
        toastBanner.classList.add('opacity-100', 'translate-y-0');

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toastBanner.classList.remove('opacity-100', 'translate-y-0');
            toastBanner.classList.add('opacity-0', 'translate-y-2');
        }, 2500);
    }

    function about() {
        showToast('ส่วนงานเกรดบี - รายงานสต็อก (Version 3.0) • Powered by Flatbar Division™️');
    }

    // =========================================================================
    // 5. Table Rendering
    // =========================================================================
    const formatNumber = (num, isTotal = false) => {
        if (num === 0) return `<span class="text-slate-300">0</span>`;
        return `<span class="${isTotal ? 'font-bold text-blue-700 bg-blue-50 px-2 py-1 rounded' : 'font-medium text-slate-700'}">${num.toLocaleString()}</span>`;
    };

    const renderTable = (searchTerm = '') => {
        tableBody.innerHTML = '';
        let currentTotal = 0;

        const filteredData = inventoryData.filter(item =>
            item.name.toLowerCase().includes(searchTerm.toLowerCase())
        );

        if (filteredData.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-slate-500">ไม่พบข้อมูลที่ค้นหา</td></tr>`;
        }

        filteredData.forEach(item => {
            currentTotal += item.total;
            const row = document.createElement('tr');
            row.className = 'hover:bg-blue-50/50 transition-colors duration-150';

            // Column 1: Pipe Size cell (clickable when allowEdit is enabled)
            const nameCell = document.createElement('td');
            nameCell.className = allowEdit
                ? 'py-3 px-6 font-medium min-w-[100px] cursor-pointer text-blue-700 hover:bg-blue-100/70 hover:underline transition-colors'
                : 'py-3 px-6 text-slate-800 font-medium min-w-[100px]';
            nameCell.setAttribute('style', 'padding-top: 3px;text-align: center;padding-right: 3px;padding-left: 3px;padding-bottom: 3px;');
            nameCell.textContent = item.name;

            if (allowEdit) {
                nameCell.title = 'คลิกเพื่อแก้ไขข้อมูล';
                nameCell.addEventListener('click', () => openEditRowModal(item));
            }

            // Column 2: ท่อเหล็กดำ
            const blackCell = document.createElement('td');
            blackCell.className = 'py-3 px-6 text-right';
            blackCell.innerHTML = formatNumber(item.black);

            // Column 3: ท่อเหล็ก GI
            const giCell = document.createElement('td');
            giCell.className = 'py-3 px-6 text-right';
            giCell.innerHTML = formatNumber(item.gi);

            // Column 4: จำนวนรวม
            const totalCell = document.createElement('td');
            totalCell.className = 'py-3 px-6 text-right';
            totalCell.innerHTML = formatNumber(item.total, true);

            row.appendChild(nameCell);
            row.appendChild(blackCell);
            row.appendChild(giCell);
            row.appendChild(totalCell);
            tableBody.appendChild(row);
        });

        // Update Grand Total
        grandTotalElement.innerText = currentTotal.toLocaleString();
    };

    // =========================================================================
    // 6. Settings Modal Controls
    // =========================================================================
    function openSettingsModal(event) {
        if (event) {
            event.stopPropagation();
        }
        allowEditCheckbox.checked = allowEdit;
        settingsModal.classList.remove('hidden');
        settingsModal.classList.add('flex');
    }

    function closeSettingsModal() {
        settingsModal.classList.add('hidden');
        settingsModal.classList.remove('flex');
    }

    allowEditCheckbox.addEventListener('change', () => {
        saveAllowEditSetting(allowEditCheckbox.checked);
        renderTable(searchInput.value);
        showToast(allowEdit ? 'เปิดใช้งานโหมดแก้ไขแล้ว' : 'ปิดโหมดแก้ไขแล้ว');
    });

    closeSettingsIconBtn.addEventListener('click', closeSettingsModal);
    closeSettingsBtn.addEventListener('click', closeSettingsModal);
    settingsModal.addEventListener('click', (e) => {
        if (e.target === settingsModal) {
            closeSettingsModal();
        }
    });

    // =========================================================================
    // 7. Edit Row Modal Controls & Validation
    // =========================================================================
    function clearEditErrors() {
        editBlackInput.classList.remove('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
        editGiInput.classList.remove('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
        editBlackError.textContent = '';
        editBlackError.classList.add('hidden');
        editGiError.textContent = '';
        editGiError.classList.add('hidden');
    }

    function updateEditTotalPreview() {
        const rawBlack = editBlackInput.value.trim();
        const rawGi = editGiInput.value.trim();
        const valBlack = /^\d+$/.test(rawBlack) ? parseInt(rawBlack, 10) : 0;
        const valGi = /^\d+$/.test(rawGi) ? parseInt(rawGi, 10) : 0;
        editTotalPreview.textContent = (valBlack + valGi).toLocaleString();
    }

    function openEditRowModal(item) {
        if (!allowEdit || !item) return;
        editingItem = item;
        clearEditErrors();
        editRowPipeName.textContent = item.name;
        editBlackInput.value = item.black;
        editGiInput.value = item.gi;
        updateEditTotalPreview();

        editRowModal.classList.remove('hidden');
        editRowModal.classList.add('flex');
        requestAnimationFrame(() => editBlackInput.focus());
    }

    function closeEditRowModal() {
        editRowModal.classList.add('hidden');
        editRowModal.classList.remove('flex');
        editingItem = null;
    }

    // Prevent typing decimal or scientific notation keys in integer stock fields
    [editBlackInput, editGiInput].forEach((inputEl) => {
        inputEl.addEventListener('keydown', (e) => {
            if (['.', ',', 'e', 'E', '+', '-'].includes(e.key)) {
                e.preventDefault();
            }
        });
        inputEl.addEventListener('input', () => {
            clearEditErrors();
            updateEditTotalPreview();
        });
    });

    editRowForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!editingItem) return;
        clearEditErrors();

        let isValid = true;
        const rawBlack = editBlackInput.value.trim();
        const rawGi = editGiInput.value.trim();

        if (rawBlack === '' || !/^\d+$/.test(rawBlack)) {
            editBlackInput.classList.add('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
            editBlackError.textContent = 'กรุณาระบุจำนวนเต็มตั้งแต่ 0 ขึ้นไป';
            editBlackError.classList.remove('hidden');
            isValid = false;
        }

        if (rawGi === '' || !/^\d+$/.test(rawGi)) {
            editGiInput.classList.add('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
            editGiError.textContent = 'กรุณาระบุจำนวนเต็มตั้งแต่ 0 ขึ้นไป';
            editGiError.classList.remove('hidden');
            isValid = false;
        }

        if (!isValid) return;

        const newBlack = parseInt(rawBlack, 10);
        const newGi = parseInt(rawGi, 10);
        const editedName = editingItem.name;

        // Calculate delta from current inventoryData values and submit to Google Forms BEFORE overwriting
        summitGS(editedName, newBlack, newGi);

        // Update table row data in memory
        editingItem.black = newBlack;
        editingItem.gi = newGi;
        editingItem.total = newBlack + newGi;

        // Re-render table & grand total
        renderTable(searchInput.value);

        closeEditRowModal();
        showToast(`บันทึกการแก้ไข ${editedName} เรียบร้อยแล้ว`);
    });

    closeEditRowIconBtn.addEventListener('click', closeEditRowModal);
    cancelEditRowBtn.addEventListener('click', closeEditRowModal);
    editRowModal.addEventListener('click', (e) => {
        if (e.target === editRowModal) {
            closeEditRowModal();
        }
    });

    // Close open modal on Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (!editRowModal.classList.contains('hidden')) {
            closeEditRowModal();
        } else if (!settingsModal.classList.contains('hidden')) {
            closeSettingsModal();
        }
    });

    // =========================================================================
    // 8. Google Sheets Fetch Logic (Preserved)
    // =========================================================================
    function updateStock() {
        const part0 = "AIzaSyAFnyXSAki4Licz";
        const part1 = "KNhyEzbhHsvTC-abfAo";
        const apiKey = part0 + part1;
        const spreadsheetId = "1s7a7fQUrzceR8-TNmkQuNkvWkbCkQ7rydrS6teqicXo";
        const range = "รายงานสต็อกท่อเกรดบี!A3:D45";

        fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`)
            .then(response => response.json())
            .then(data => {
                if (!data.values) {
                    console.error("No data found or wrong range provided.");
                    return;
                }

                const dataArray = data.values;

                // Loop through the returned array of arrays
                dataArray.forEach(row => {
                    if (row.length === 0) return; // Skip empty rows

                    const itemName = row[0]; // The name is in the first column (Index 0)

                    // Remove commas and parse to integer, default to 0 if empty
                    const blackValue = parseInt((row[1] || "0").replace(/,/g, ''), 10) || 0;
                    const giValue = parseInt((row[2] || "0").replace(/,/g, ''), 10) || 0;

                    // Find matching item in inventoryData
                    const targetItem = inventoryData.find(item => item.name === itemName);

                    if (targetItem) {
                        targetItem.black = blackValue;
                        targetItem.gi = giValue;
                        targetItem.total = targetItem.black + targetItem.gi;
                    }
                });

                // Re-render the table AFTER the data has finished updating
                const currentSearchTerm = searchInput.value;
                renderTable(currentSearchTerm);
            })
            .catch(error => {
                console.error("Error fetching data from Google Sheets:", error);
            });
    }

    // =========================================================================
    // 9. Initialize App
    // =========================================================================
    loadAllowEditSetting();
    renderTable();
    updateStock();

    // Search Event Listener
    searchInput.addEventListener('input', (e) => {
        renderTable(e.target.value);
    });
    </script>

</body>
</html>
