
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Editable Google Sheets Table</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f6f8;
    }

    button {
      padding: 9px 14px;
      margin: 4px;
      cursor: pointer;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 15px;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }

    th {
      background: #e8edf2;
    }

    input {
      width: 95%;
      padding: 6px;
      box-sizing: border-box;
    }

    #status {
      margin: 12px 0;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>Inventory Management</h2>

  <button onclick="authorize()">Connect Google</button>
  <button onclick="loadData()">Refresh</button>
  <button onclick="addRow()">Add New Row</button>

  <div id="status">Not connected</div>

  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Code</th>
        <th>Qty</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="tableBody"></tbody>
  </table>

  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>

  <script>
    // ================================
    // CONFIGURATION
    // ================================

    const CLIENT_ID = "YOUR_CLIENT_ID.apps.googleusercontent.com";
	const part0 = "AIzaSyAFnyXSAki4Licz";
  	const part1 = "KNhyEzbhHsvTC-abfAo";
  	const API_KEY = part0 + part1;

    const SPREADSHEET_ID = "1IkO_AxMnh_yYFDsEV_7MAaGUCrgXptbby6et7Rt-T5w";
    const SHEET_NAME = "shipment_data_table";

    const RANGE = `${SHEET_NAME}!A:C`;

    const SCOPES =
      "https://www.googleapis.com/auth/spreadsheets";

    const DISCOVERY_DOC =
      "https://sheets.googleapis.com/$discovery/rest?version=v4";

    let tokenClient;
    let isAuthorized = false;

    // ================================
    // INITIALIZE GOOGLE API
    // ================================

    async function initGoogleAPI() {
      await new Promise(resolve => gapi.load("client", resolve));

      await gapi.client.init({
        apiKey: API_KEY,
        discoveryDocs: [DISCOVERY_DOC]
      });

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,

        callback: async (response) => {
          if (response.error) {
            showStatus("Authorization failed: " + response.error);
            return;
          }

          gapi.client.setToken(response);

          isAuthorized = true;

          showStatus("Connected to Google Sheets");

          await loadData();
        }
      });
    }

    // ================================
    // AUTHORIZE
    // ================================

    function authorize() {
      if (!tokenClient) {
        showStatus("Google API is initializing...");
        return;
      }

      tokenClient.requestAccessToken({
        prompt: isAuthorized ? "" : "consent"
      });
    }

    // ================================
    // LOAD DATA FROM GOOGLE SHEETS
    // ================================

    async function loadData() {
      if (!isAuthorized) {
        showStatus("Please connect Google first");
        return;
      }

      try {
        showStatus("Loading data...");

        const response =
          await gapi.client.sheets.spreadsheets.values.get({
            spreadsheetId: SPREADSHEET_ID,
            range: RANGE
          });

        const values = response.result.values || [];

        renderTable(values);

        showStatus("Data loaded successfully");

      } catch (error) {
        console.error(error);
        showStatus("Load error: " + error.message);
      }
    }

    // ================================
    // RENDER HTML TABLE
    // ================================

    function renderTable(values) {
      const tbody = document.getElementById("tableBody");

      tbody.innerHTML = "";

      // Skip header row (row 1)
      for (let i = 1; i < values.length; i++) {

        const sheetRow = i + 1;

        const row = values[i];

        const tr = document.createElement("tr");

        // Item, Code, Qty
        for (let j = 0; j < 3; j++) {

          const td = document.createElement("td");

          const input = document.createElement("input");

          input.value = row[j] ?? "";

          input.dataset.column = j;

          td.appendChild(input);

          tr.appendChild(td);
        }

        // Save button
        const actionTd = document.createElement("td");

        const saveBtn = document.createElement("button");

        saveBtn.textContent = "Save";

        saveBtn.onclick = () => saveRow(tr, sheetRow);

        actionTd.appendChild(saveBtn);

        tr.appendChild(actionTd);

        tbody.appendChild(tr);
      }
    }

    // ================================
    // SAVE EDITED ROW
    // ================================

    async function saveRow(tr, sheetRow) {

      const inputs = tr.querySelectorAll("input");

      const values = [
        [
          inputs[0].value,
          inputs[1].value,
          inputs[2].value
        ]
      ];

      try {

        const range =
          `${SHEET_NAME}!A${sheetRow}:C${sheetRow}`;

        await gapi.client.sheets.spreadsheets.values.update({
          spreadsheetId: SPREADSHEET_ID,
          range: range,
          valueInputOption: "USER_ENTERED",
          resource: {
            values: values
          }
        });

        showStatus(`Saved row ${sheetRow} successfully`);

      } catch (error) {

        console.error(error);

        showStatus("Save error: " + error.message);
      }
    }

    // ================================
    // ADD NEW ROW
    // ================================

    function addRow() {

      const tbody = document.getElementById("tableBody");

      const tr = document.createElement("tr");

      // Create 3 editable cells
      for (let i = 0; i < 3; i++) {

        const td = document.createElement("td");

        const input = document.createElement("input");

        input.placeholder = "Enter value";

        td.appendChild(input);

        tr.appendChild(td);
      }

      const actionTd = document.createElement("td");

      const saveBtn = document.createElement("button");

      saveBtn.textContent = "Add to Sheet";

      saveBtn.onclick = () => saveNewRow(tr);

      actionTd.appendChild(saveBtn);

      tr.appendChild(actionTd);

      tbody.appendChild(tr);
    }

    // ================================
    // SAVE NEW ROW TO SHEET
    // ================================

    async function saveNewRow(tr) {

      const inputs = tr.querySelectorAll("input");

      const values = [
        [
          inputs[0].value,
          inputs[1].value,
          inputs[2].value
        ]
      ];

      try {

        await gapi.client.sheets.spreadsheets.values.append({
          spreadsheetId: SPREADSHEET_ID,
          range: RANGE,
          valueInputOption: "USER_ENTERED",
          insertDataOption: "INSERT_ROWS",
          resource: {
            values: values
          }
        });

        showStatus("New row added successfully");

        await loadData();

      } catch (error) {

        console.error(error);

        showStatus("Add row error: " + error.message);
      }
    }

    // ================================
    // STATUS MESSAGE
    // ================================

    function showStatus(message) {
      document.getElementById("status").textContent = message;
    }

    // ================================
    // START
    // ================================

    window.onload = initGoogleAPI;

  </script>

</body>
</html>
